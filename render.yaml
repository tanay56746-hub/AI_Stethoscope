# ==============================================================================
# [LAYER: RENDER CLOUD BLUEPRINT] | File: render.yaml
# Purpose: Render Python Web Service Deployment Specification for AI Stethoscope
# ==============================================================================
services:
  - type: web
    name: ai-stethoscope-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python backend/download_weights.py
    startCommand: python backend/demo_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
